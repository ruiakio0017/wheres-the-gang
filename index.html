<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHERE'S THE GANG?</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f12;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 18px;
      color: #bdbdbd;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: #111;
    }

    .secondary {
      background: #24242a;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>WHERE’S THE GANG?</h1>

    <p class="tagline">
      Class can wait. The gang can't. 😂
    </p>

    <div class="buttons">
      <button class="primary">📍 Explore Places</button>
      <button class="secondary">🎯 Where Should We Go?</button>
    </div>
  </div>

</body>
</html>
