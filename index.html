<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070611">
<title>WHERE'S THE GANG? — V8 HORIZON</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  background:#06050b;
}

/* =========================================================
   HORIZON BACKGROUND
========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:-35%;
  z-index:-10;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(133,77,255,.28),
      transparent 27%
    ),
    radial-gradient(
      circle at 82% 25%,
      rgba(255,65,206,.22),
      transparent 27%
    ),
    radial-gradient(
      circle at 50% 95%,
      rgba(40,166,255,.18),
      transparent 30%
    );

  animation:horizonMove 16s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-9;
  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,255,255,.018) 45%,
      transparent 55%
    );

  background-size:250% 250%;
  animation:lightSweep 14s linear infinite;
}

@keyframes horizonMove{
  0%{
    transform:translate(-4%,-2%) scale(1);
  }

  50%{
    transform:translate(4%,3%) scale(1.08);
  }

  100%{
    transform:translate(-2%,6%) scale(1.15);
  }
}

@keyframes lightSweep{
  from{
    background-position:200% 0;
  }

  to{
    background-position:-200% 0;
  }
}

/* =========================================================
   PARTICLES
========================================================= */

.horizonParticles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-5;
}

.horizonParticles i{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  opacity:.3;

  box-shadow:
    0 0 12px rgba(255,255,255,.8);

  animation:
    particleFloat linear infinite;
}

.horizonParticles i:nth-child(1){
  left:6%;
  top:80%;
  animation-duration:13s;
}

.horizonParticles i:nth-child(2){
  left:16%;
  top:45%;
  animation-duration:17s;
}

.horizonParticles i:nth-child(3){
  left:28%;
  top:85%;
  animation-duration:15s;
}

.horizonParticles i:nth-child(4){
  left:39%;
  top:30%;
  animation-duration:19s;
}

.horizonParticles i:nth-child(5){
  left:51%;
  top:70%;
  animation-duration:14s;
}

.horizonParticles i:nth-child(6){
  left:63%;
  top:25%;
  animation-duration:18s;
}

.horizonParticles i:nth-child(7){
  left:76%;
  top:72%;
  animation-duration:16s;
}

.horizonParticles i:nth-child(8){
  left:88%;
  top:35%;
  animation-duration:20s;
}

.horizonParticles i:nth-child(9){
  left:94%;
  top:82%;
  animation-duration:12s;
}

@keyframes particleFloat{
  0%{
    transform:translateY(50px);
    opacity:0;
  }

  20%{
    opacity:.4;
  }

  75%{
    opacity:.25;
  }

  100%{
    transform:translateY(-110vh);
    opacity:0;
  }
}

/* =========================================================
   APP
========================================================= */

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  position:relative;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  width:100%;
  max-width:940px;
  margin:auto;
  min-height:100vh;
  padding:32px 18px 100px;

  animation:
    pageIn .6s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.985);
    filter:blur(5px);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

/* =========================================================
   BRAND
========================================================= */

.brand{
  text-align:center;
  margin-top:8px;
}

.made{
  color:#888493;
  font-size:11px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:40px;

  animation:
    fadeDown .7s ease both;
}

@keyframes fadeDown{
  from{
    opacity:0;
    transform:translateY(-15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logo{
  position:relative;

  font-size:clamp(43px,11vw,82px);
  line-height:.84;

  font-weight:1000;
  letter-spacing:-5px;

  text-transform:uppercase;

  text-shadow:
    0 0 25px rgba(139,92,255,.15),
    0 0 60px rgba(255,79,216,.08);

  animation:
    logoIn .8s cubic-bezier(.2,.8,.2,1);
}

.logo span{
  display:block;
}

.logo::after{
  content:"";

  display:block;

  width:90px;
  height:4px;

  margin:25px auto 0;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #8b5cff,
      #ff4fd8,
      #42b9ff
    );

  box-shadow:
    0 0 18px rgba(255,79,216,.6);

  animation:
    horizonLine 3s ease-in-out infinite;
}

@keyframes logoIn{
  from{
    opacity:0;
    transform:scale(.88);
    filter:blur(10px);
  }

  to{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

@keyframes horizonLine{
  0%,100%{
    width:70px;
    opacity:.65;
  }

  50%{
    width:160px;
    opacity:1;
  }
}

.tagline{
  margin:35px auto 28px;

  color:#aaa7b5;

  font-size:
    clamp(17px,4.7vw,28px);

  line-height:1.25;
}

/* =========================================================
   USER BADGE
========================================================= */

.userBadge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  color:#aaa7b5;

  font-size:14px;

  margin-bottom:25px;

  padding:8px 13px;

  border:
    1px solid rgba(255,255,255,.07);

  background:
    rgba(255,255,255,.035);

  border-radius:999px;

  backdrop-filter:blur(12px);
}

.userBadge strong{
  color:#fff;
}

/* =========================================================
   MAIN BUTTONS
========================================================= */

.actions{
  display:grid;
  gap:14px;
}

.mainBtn{
  position:relative;
  overflow:hidden;

  min-height:74px;

  border-radius:27px;

  padding:18px 20px;

  color:#fff;

  font-weight:900;
  font-size:19px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  border:
    1px solid rgba(255,255,255,.09);

  backdrop-filter:blur(18px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.18);

  transition:
    transform .3s cubic-bezier(.2,.8,.2,1),
    border-color .3s,
    box-shadow .3s;

  animation:
    buttonIn .6s ease both;
}

.mainBtn:nth-child(2){
  animation-delay:.08s;
}

.mainBtn:nth-child(3){
  animation-delay:.16s;
}

@keyframes buttonIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.mainBtn::before{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:70%;
  height:100%;

  transform:skewX(-20deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.15),
      transparent
    );

  transition:.7s;
}

.mainBtn:hover::before{
  left:150%;
}

.mainBtn:hover{
  transform:
    translateY(-5px)
    scale(1.015);

  border-color:
    rgba(255,255,255,.18);

  box-shadow:
    0 20px 55px rgba(0,0,0,.28),
    0 0 35px rgba(139,92,255,.09);
}

.mainBtn:active{
  transform:scale(.96);
}

.mainBtn.light{
  background:
    linear-gradient(
      135deg,
      #fff,
      #eeeaff
    );

  color:#111;
}

/* =========================================================
   SECTION HEADER
========================================================= */

.sectionTop{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:20px;
}

.backBtn,
.changeBtn{
  padding:11px 16px;
  border-radius:15px;
  font-weight:900;

  transition:.25s ease;
}

.backBtn{
  color:#fff;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.08);
}

.changeBtn{
  background:#fff;
  color:#111;
}

.backBtn:hover,
.changeBtn:hover{
  transform:translateY(-3px);
}

/* =========================================================
   TITLES
========================================================= */

.pageTitle{
  font-size:
    clamp(30px,8vw,50px);

  font-weight:1000;

  letter-spacing:-2px;

  margin:18px 0 7px;
}

.pageSub{
  color:#9996a5;

  line-height:1.55;

  margin-bottom:25px;
}

/* =========================================================
   LOCATION
========================================================= */

.locationPill{
  display:inline-flex;

  padding:8px 13px;

  border-radius:999px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.09);

  color:#bbb8c6;

  font-size:12px;

  font-weight:900;

  margin-bottom:20px;

  backdrop-filter:blur(10px);
}

/* =========================================================
   SEARCH
========================================================= */

.search,
.input{
  width:100%;

  background:
    rgba(10,10,17,.72);

  border:
    1px solid rgba(255,255,255,.10);

  color:#fff;

  padding:16px 18px;

  border-radius:18px;

  outline:none;

  transition:.3s ease;
}

.search{
  margin-bottom:18px;
}

.search:focus,
.input:focus{
  border-color:
    rgba(139,92,255,.7);

  box-shadow:
    0 0 0 4px rgba(139,92,255,.09),
    0 0 25px rgba(139,92,255,.10);
}

/* =========================================================
   CATEGORY GRID
========================================================= */

.categoryGrid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:13px;
}

.category{
  position:relative;
  overflow:hidden;

  min-height:108px;

  border-radius:24px;

  padding:17px;

  text-align:left;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      rgba(35,31,53,.78),
      rgba(17,16,25,.78)
    );

  border:
    1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(14px);

  transition:
    .3s cubic-bezier(.2,.8,.2,1);

  animation:
    cardIn .55s ease both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

.category::after{
  content:"";

  position:absolute;

  width:110px;
  height:110px;

  right:-50px;
  bottom:-60px;

  border-radius:50%;

  background:
    rgba(139,92,255,.12);

  filter:blur(12px);

  transition:.4s;
}

.category:hover{
  transform:
    translateY(-7px)
    scale(1.02);

  border-color:
    rgba(255,255,255,.16);

  box-shadow:
    0 18px 45px rgba(0,0,0,.25),
    0 0 35px rgba(139,92,255,.08);
}

.category:hover::after{
  transform:scale(1.8);
}

.category:active{
  transform:scale(.96);
}

.category .emoji{
  font-size:29px;

  display:block;

  margin-bottom:9px;

  transition:.3s ease;
}

.category:hover .emoji{
  transform:
    scale(1.18)
    rotate(-5deg);
}

.category b{
  font-size:15px;
}

.category small{
  display:block;

  color:#777483;

  margin-top:5px;
}

/* =========================================================
   SPECIAL CARD
========================================================= */

.specialCard{
  margin-top:18px;

  border:
    1px solid rgba(255,255,255,.10);

  background:
    linear-gradient(
      135deg,
      rgba(42,34,65,.78),
      rgba(15,14,23,.8)
    );

  border-radius:26px;

  padding:20px;

  backdrop-filter:blur(18px);

  animation:
    specialGlow 4s ease-in-out infinite;
}

@keyframes specialGlow{
  0%,100%{
    box-shadow:
      0 20px 55px rgba(0,0,0,.18);
  }

  50%{
    box-shadow:
      0 20px 55px rgba(0,0,0,.18),
      0 0 40px rgba(139,92,255,.09);
  }
}

.specialCard h3{
  margin:0 0 6px;

  font-size:20px;
}

.specialCard p{
  color:#9b98a7;

  margin:0 0 14px;

  line-height:1.45;
}

.specialBtn{
  width:100%;

  border-radius:17px;

  padding:15px;

  background:#fff;

  color:#111;

  font-weight:1000;

  transition:.25s ease;
}

.specialBtn:hover{
  transform:translateY(-3px);

  box-shadow:
    0 12px 30px rgba(255,255,255,.12);
}

/* =========================================================
   PLACE CARDS
========================================================= */

.cards{
  display:grid;
  gap:14px;
}

.placeCard{
  background:
    linear-gradient(
      145deg,
      rgba(25,23,36,.78),
      rgba(13,13,19,.78)
    );

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:23px;

  padding:18px;

  backdrop-filter:blur(15px);

  transition:.3s ease;

  animation:
    cardIn .5s ease both;
}

.placeCard:hover{
  transform:translateY(-4px);

  border-color:
    rgba(255,255,255,.15);

  box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.placeHead{
  display:flex;

  justify-content:space-between;

  gap:12px;

  align-items:flex-start;
}

.placeName{
  font-size:19px;

  font-weight:950;

  line-height:1.2;
}

.placeType{
  white-space:nowrap;

  font-size:10px;

  color:#aaa7b5;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:999px;

  padding:6px 9px;
}

.placeDesc{
  color:#9895a2;

  line-height:1.5;

  margin:10px 0 14px;
}

.placeBtns{
  display:flex;

  gap:8px;

  flex-wrap:wrap;
}

.mapBtn,
.tag{
  transition:.25s ease;
}

.mapBtn{
  background:#fff;

  color:#111;

  padding:10px 13px;

  border-radius:13px;

  font-size:13px;

  font-weight:900;

  text-decoration:none;
}

.mapBtn:hover{
  transform:translateY(-2px);
}

.tag{
  background:
    rgba(255,255,255,.07);

  color:#bdbac8;

  padding:9px 12px;

  border-radius:13px;

  font-size:12px;

  font-weight:800;
}

/* =========================================================
   NOTICE
========================================================= */

.notice{
  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.07);

  border-radius:18px;

  padding:14px;

  color:#858290;

  font-size:12px;

  line-height:1.5;

  margin-bottom:18px;

  backdrop-filter:blur(12px);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  text-align:center;

  padding:50px 20px;

  color:#858290;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.06);

  border-radius:22px;
}

/* =========================================================
   FLOATING BUTTON
========================================================= */

.floating{
  position:fixed;

  right:18px;
  bottom:20px;

  z-index:50;

  width:52px;
  height:52px;

  border-radius:50%;

  background:
    rgba(255,255,255,.92);

  color:#111;

  font-size:20px;

  font-weight:1000;

  box-shadow:
    0 8px 30px rgba(0,0,0,.4),
    0 0 25px rgba(139,92,255,.12);

  transition:.25s ease;
}

.floating:hover{
  transform:
    translateY(-5px)
    rotate(-5deg);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(2,2,6,.78);

  backdrop-filter:blur(18px);

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal.show{
  display:flex;

  animation:
    modalIn .3s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

.modalBox{
  width:min(520px,100%);

  background:
    linear-gradient(
      145deg,
      rgba(31,28,46,.96),
      rgba(13,13,20,.97)
    );

  border:
    1px solid rgba(255,255,255,.11);

  border-radius:30px;

  padding:24px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.7),
    0 0 50px rgba(139,92,255,.08);

  animation:
    modalBoxIn .4s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalBoxIn{
  from{
    transform:
      translateY(25px)
      scale(.94);
  }

  to{
    transform:
      translateY(0)
      scale(1);
  }
}

.modalBox h2{
  margin:0 0 8px;

  font-size:29px;
}

.modalBox p{
  color:#94919e;

  line-height:1.45;
}

.setupStep{
  display:none;
}

.setupStep.active{
  display:block;
}

.input{
  margin:15px 0;
}

.collegeOptions{
  display:grid;

  gap:12px;

  margin-top:20px;
}

.collegeOption{
  text-align:left;

  background:
    rgba(255,255,255,.055);

  color:#fff;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:20px;

  padding:17px;

  transition:.25s ease;
}

.collegeOption:hover{
  transform:translateX(4px);
}

.collegeOption.selected{
  background:#fff;

  color:#111;

  border-color:#fff;

  box-shadow:
    0 10px 35px rgba(255,255,255,.1);
}

.collegeOption b{
  display:block;

  font-size:17px;
}

.collegeOption small{
  display:block;

  margin-top:5px;

  opacity:.7;
}

.modalActions{
  display:flex;

  gap:10px;

  margin-top:18px;
}

.modalActions button{
  flex:1;

  padding:14px;

  border-radius:15px;

  font-weight:900;
}

.primary{
  background:#fff;

  color:#111;
}

.secondary{
  background:#292733;

  color:#fff;
}

/* =========================================================
   BEAUTY MODE V8
========================================================= */

.beauty{
  text-align:center;

  padding-top:8vh;

  min-height:100vh;

  position:relative;
}

.beauty::before{
  content:"";

  position:absolute;

  width:330px;
  height:330px;

  top:18%;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,79,216,.17),
      transparent 65%
    );

  filter:blur(25px);

  pointer-events:none;

  animation:
    beautyGlow 5s ease-in-out infinite;
}

@keyframes beautyGlow{
  0%,100%{
    transform:
      translateX(-50%)
      scale(.9);

    opacity:.6;
  }

  50%{
    transform:
      translateX(-50%)
      scale(1.25);

    opacity:1;
  }
}

.beautyIcon{
  position:relative;

  font-size:70px;

  margin:40px 0 30px;

  animation:
    beautyFloat 2.8s ease-in-out infinite;
}

@keyframes beautyFloat{
  0%,100%{
    transform:
      translateY(0)
      rotate(-3deg);
  }

  50%{
    transform:
      translateY(-13px)
      rotate(3deg);
  }
}

.beautyText{
  position:relative;

  font-size:
    clamp(25px,7vw,48px);

  font-weight:1000;

  line-height:1.08;

  max-width:700px;

  margin:
    0 auto 35px;

  transition:
    .35s ease;

  text-shadow:
    0 0 35px rgba(255,79,216,.12);
}

/*
  THE BEAUTY BUTTON IS FIXED SO
  IT CAN ESCAPE AROUND THE SCREEN.
*/

.beautyBtn{
  position:fixed;

  z-index:120;

  left:50%;

  bottom:88px;

  transform:
    translateX(-50%);

  background:#fff;

  color:#111;

  padding:16px 28px;

  border-radius:18px;

  font-weight:1000;

  min-width:150px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.35),
    0 0 30px rgba(255,255,255,.08);

  transition:
    left .55s cubic-bezier(.2,.8,.2,1),
    bottom .55s cubic-bezier(.2,.8,.2,1),
    transform .35s ease,
    box-shadow .3s ease;
}

.beautyBtn:hover{
  box-shadow:
    0 18px 45px rgba(0,0,0,.45),
    0 0 35px rgba(255,79,216,.16);
}

.beautyBtn:active{
  transform:
    translateX(-50%)
    scale(.92);
}

.beautyBack{
  position:relative;

  background:
    rgba(255,255,255,.07);

  color:#fff;

  padding:12px 20px;

  border-radius:15px;

  font-weight:900;

  transition:.25s ease;
}

.beautyBack:hover{
  transform:translateY(-3px);

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      version:APP_VERSION,
      name:selectedName,
      college:selectedCollege
    })
  );

}

function loadData(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)||"null"
      );

    if(
      data &&
      data.name &&
      data.college
    ){

      selectedName=data.name;
      selectedCollege=data.college;

      return true;
    }

  }catch(e){

    console.warn(
      "Storage reset:",
      e
    );

  }

  return false;
}

function renderExplore(){

  const data=
    getExploreData();

  const filters=[

        data.map(x=>x[1])
      )
    )
  ];


  document.getElementById("app").innerHTML=`

    <main class="page">

      ${header(
        "Explore Places",
        "Everything shown below belongs to your selected college's location."
      )}


      <div class="notice">

        🔒

          ?

          "Every card below is Jayanagar-focused."

          :

          "Every card below is Basavanagudi / N.R. Colony-focused."

        }

      </div>


      <input
        id="exploreSearch"
        class="search"
        placeholder="Search places..."
        oninput="filterExplore()"
      >


      <div
        id="exploreFilters"
        class="placeBtns"
        style="margin-bottom:18px;"
      >

        ${filters.map(f=>`

          <button
            class="tag"
            onclick="setExploreFilter('${escapeHtml(f)}')"

            style="${
              exploreFilter===f
              ?
              "background:#fff;color:#111;"
              :
              ""
            }"
          >

            ${
              escapeHtml(
                f==="all"
                ?
                "All"
                :
                f
              )
            }

          </button>

        `).join("")}

      </div>


      <div
        id="exploreCards"
        class="cards"
      ></div>


      <div class="footer">

        Always check current hours/status
        before travelling.

        <br><br>

        MADE BY KUSH KUMAR

      </div>

    </main>

  `;


  drawExploreCards(data);

}


function setExploreFilter(filter){

  exploreFilter=filter;

  renderExplore();

}


function filterExplore(){

  const data=
    getExploreData();

  drawExploreCards(data);

}


function drawExploreCards(data){

  const search=
    (
      document.getElementById(
        "exploreSearch"
      )?.value||""
    ).toLowerCase();


  const filtered=
    data.filter(item=>{

      const matchesFilter=
        exploreFilter==="all" ||
        item[1]===exploreFilter;

      const text=
        item.join(" ").toLowerCase();

      return(
        matchesFilter &&
        text.includes(search)
      );

    });


  const box=
    document.getElementById(
      "exploreCards"
    );

  if(!box)return;


  if(!filtered.length){

    box.innerHTML=`

      <div class="empty">

        No matching place found 😭

      </div>

    `;

    return;

  }


  box.innerHTML=
    filtered.map(item=>{

      const [
        name,
        type,
        area,
        desc
      ]=item;


      return`

        <article class="placeCard">

          <div class="placeHead">

            <div class="placeName">

              ${escapeHtml(name)}

            </div>


            <div class="placeType">

              ${escapeHtml(type)}

            </div>

          </div>


          <div class="placeDesc">

            ${escapeHtml(desc)}

            <br>

            <span
              style="color:#666670"
            >
              ${escapeHtml(area)}
            </span>

          </div>


          <div class="placeBtns">

            <a
              class="mapBtn"
              href="${mapLink(name,area)}"
              target="_blank"
              rel="noopener"
            >
              📍 Maps
            </a>


            <span class="tag">

              ${escapeHtml(
                getCollegeShort()
              )}

            </span>

          </div>

        </article>

      `;

    }).join("");

}

    );


  /* TEXT ANIMATION */

  if(text){

    text.style.opacity="0";

    text.style.transform=
      "translateY(15px) scale(.96)";


    setTimeout(()=>{

      text.textContent=
        beautyMessages[
          beautyStep
        ];


      text.style.opacity="1";

      text.style.transform=
        "translateY(0) scale(1)";

    },180);

  }


  /* BUTTON MOVEMENT */

  if(next){

    if(
      beautyStep<
      beautyMessages.length-1
    ){

      const positions=[

        {
          left:"50%",
          bottom:"88px"
        },

        {
          left:"19%",
          bottom:"23%"
        },

        {
          left:"79%",
          bottom:"28%"
        },

        {
          left:"29%",
          bottom:"48%"
        },

        {
          left:"73%",
          bottom:"51%"
        }

      ];


      const pos=
        positions[
          beautyStep
        ];


      next.style.left=
        pos.left;

      next.style.bottom=
        pos.bottom;


      /*
        POP + ROTATE
      */

      const rotation=
        beautyStep%2===0
        ?
        -3
        :
        3;


      next.animate(

        [

          {
            transform:
              "translateX(-50%) scale(.65) rotate(12deg)",
            opacity:.25
          },

          {
            transform:
              "translateX(-50%) scale(1.15) rotate(-5deg)",
            opacity:1
          },

          {
            transform:
              "translateX(-50%) scale(1) rotate("+
              rotation+
              "deg)"
          }

        ],

        {
          duration:520,
          easing:
            "cubic-bezier(.2,.8,.2,1)"
        }

      );

    }


    /* FINAL STEP */

    if(
      beautyStep===
      beautyMessages.length-1
    ){

      next.animate(

        [

          {
            opacity:1,

            transform:
              "translateX(-50%) scale(1)"
          },

          {
            opacity:0,

            transform:
              "translateX(-50%) scale(.35) rotate(25deg)"
          }

        ],

        {
          duration:500,
          easing:"ease-in"
        }

      );


      setTimeout(()=>{

        next.style.display="none";

      },450);

    }

  }

}


/* =========================================================
   COLLEGE CHANGE
========================================================= */

function openChangeCollege(){

  collegeChangeMode=true;

  returnPage=
    currentPage;

  temporaryCollege=
    selectedCollege;


  document.getElementById(
    "collegeModalTitle"
  ).textContent=
    "Change College 📍";


  document.getElementById(
    "collegeModalSub"
  ).textContent=
    "Your name stays saved. Only the location data will change.";


  document.getElementById(
    "nameStep"
  ).classList.remove("active");


  document.getElementById(
    "collegeStep"
  ).classList.add("active");


  updateCollegeSelection();


  document.getElementById(
    "modal"
  ).classList.add("show");

}


function chooseCollege(college){

  temporaryCollege=
    college;

  updateCollegeSelection();

}


function updateCollegeSelection(){

  document.getElementById(
    "nmkrvOption"
  )
  .classList.toggle(
    "selected",
    temporaryCollege==="NMKRV"
  );


  document.getElementById(
    "apsOption"
  )
  .classList.toggle(
    "selected",
    temporaryCollege==="Aps"
  );

}


function saveCollege(){

  if(!temporaryCollege){

    alert(
      "Pick a college first."
    );

    return;

  }


  selectedCollege=
    temporaryCollege;

  saveData();


  document.getElementById(
    "modal"
  ).classList.remove("show");


  collegeChangeMode=false;


  if(returnPage==="explore"){

    renderExplore();

  }

  else if(returnPage==="planner"){

    renderCategories();

  }

  else if(returnPage==="category"){

    openCategory(
      currentCategory
    );

  }

  else if(returnPage==="beauty"){

    renderBeauty();

  }

  else{

    renderHome();

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function cancelCollegeChange(){

  if(collegeChangeMode){

    temporaryCollege=
      selectedCollege;

    collegeChangeMode=false;


    document.getElementById(
      "modal"
    ).classList.remove("show");

    return;

  }


  closeSetup();

}


function closeSetup(){

  document.getElementById(
    "modal"
  ).classList.remove("show");

}


/* =========================================================
   FIRST SETUP
========================================================= */

function showFirstSetup(){

  collegeChangeMode=false;

  temporaryCollege="";


  document.getElementById(
    "collegeModalTitle"
  ).textContent=
    "Pick your college 📍";


  document.getElementById(
    "collegeModalSub"
  ).textContent=
    "We'll keep your places completely separated.";


  document.getElementById(
    "nameStep"
  ).classList.add("active");


  document.getElementById(
    "collegeStep"
  ).classList.remove("active");


  document.getElementById(
    "nameInput"
  ).value="";


  document.getElementById(
    "modal"
  ).classList.add("show");

}


function goToCollegeStep(){

  const input=
    document.getElementById(
      "nameInput"
    );


  const name=
    (input.value||"").trim();


  if(!name){

    input.focus();

    return;

  }


  selectedName=
    name;

  temporaryCollege="";


  document.getElementById(
    "nameStep"
  ).classList.remove("active");


  document.getElementById(
    "collegeStep"
  ).classList.add("active");


  updateCollegeSelection();

}


function initialCollegeSave(){

  if(!temporaryCollege){

    alert(
      "Pick a college first."
    );

    return;

  }


  selectedCollege=
    temporaryCollege;

  saveData();


  document.getElementById(
    "modal"
  ).classList.remove("show");


  renderHome();

}


/* =========================================================
   SAVE COLLEGE WRAPPER
========================================================= */

const originalSaveCollege=
  saveCollege;


saveCollege=function(){

  if(!collegeChangeMode){

    initialCollegeSave();

    return;

  }


  originalSaveCollege();

};


/* =========================================================
   HOME
========================================================= */

function goHome(){

  renderHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      const nameStep=
        document.getElementById(
          "nameStep"
        );


      if(

        document.getElementById(
          "modal"
        )?.classList.contains("show")

        &&

        nameStep?.classList.contains(
          "active"
        )

      ){

        goToCollegeStep();

      }

    }


    if(e.key==="Escape"){

      const modal=
        document.getElementById(
          "modal"
        );


      if(
        modal?.classList.contains("show")
      ){

        cancelCollegeChange();

      }

    }

  }
);


/* =========================================================
   START
========================================================= */

(function start(){

  if(loadData()){

    if(

      selectedCollege!=="NMKRV" &&

      selectedCollege!=="Aps"

    ){

      selectedCollege=
        "NMKRV";

      saveData();

    }


    renderHome();

  }

  else{

    showFirstSetup();

  }

})();

</script>
