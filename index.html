<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070611">
<title>WHERE'S THE GANG? — V8.6 HORIZON ULTRA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  background:#05040a;
  perspective:1200px;
}

/* =========================================================
   CURSOR SPOTLIGHT & GRID OVERLAY
========================================================= */

#cursorGlow{
  position:fixed;
  width:460px;
  height:460px;
  border-radius:50%;
  pointer-events:none;
  z-index:-4;
  transform:translate(-50%,-50%);
  background:radial-gradient(
    circle,
    rgba(139,92,255,.16) 0%,
    rgba(255,79,216,.08) 35%,
    transparent 70%
  );
  transition:opacity .4s ease;
  filter:blur(10px);
}

.cyberGrid{
  position:fixed;
  inset:0;
  z-index:-8;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center, black 35%, transparent 82%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 35%, transparent 82%);
  animation:gridDrift 24s linear infinite;
}

@keyframes gridDrift{
  from{ background-position:0 0; }
  to{ background-position:48px 48px; }
}

/* =========================================================
   HORIZON AURORA BACKGROUND
========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:-40%;
  z-index:-10;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 18%, rgba(133,77,255,.34), transparent 28%),
    radial-gradient(circle at 82% 25%, rgba(255,65,206,.28), transparent 28%),
    radial-gradient(circle at 50% 92%, rgba(40,166,255,.24), transparent 32%),
    radial-gradient(circle at 20% 75%, rgba(0,255,195,.12), transparent 26%);
  animation:horizonMove 14s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-9;
  pointer-events:none;
  background:
    linear-gradient(120deg, transparent 0%, rgba(255,255,255,.025) 45%, transparent 55%);
  background-size:250% 250%;
  animation:lightSweep 11s linear infinite;
}

@keyframes horizonMove{
  0%{ transform:translate(-5%,-3%) scale(1) rotate(0deg); }
  50%{ transform:translate(5%,4%) scale(1.1) rotate(3deg); }
  100%{ transform:translate(-3%,7%) scale(1.18) rotate(-2deg); }
}

@keyframes lightSweep{
  from{ background-position:200% 0; }
  to{ background-position:-200% 0; }
}

/* =========================================================
   PARTICLES
========================================================= */

.horizonParticles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-5;
}

.horizonParticles i{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  opacity:.35;
  box-shadow:
    0 0 12px rgba(255,255,255,.9),
    0 0 24px rgba(139,92,255,.7);
  animation:particleFloat linear infinite;
}

.horizonParticles i:nth-child(1){ left:6%; top:80%; animation-duration:13s; }
.horizonParticles i:nth-child(2){ left:16%; top:45%; animation-duration:17s; width:4px; height:4px; }
.horizonParticles i:nth-child(3){ left:28%; top:85%; animation-duration:15s; }
.horizonParticles i:nth-child(4){ left:39%; top:30%; animation-duration:19s; }
.horizonParticles i:nth-child(5){ left:51%; top:70%; animation-duration:14s; width:4px; height:4px; }
.horizonParticles i:nth-child(6){ left:63%; top:25%; animation-duration:18s; }
.horizonParticles i:nth-child(7){ left:76%; top:72%; animation-duration:16s; }
.horizonParticles i:nth-child(8){ left:88%; top:35%; animation-duration:20s; width:4px; height:4px; }
.horizonParticles i:nth-child(9){ left:94%; top:82%; animation-duration:12s; }
.horizonParticles i:nth-child(10){ left:12%; top:18%; animation-duration:21s; }
.horizonParticles i:nth-child(11){ left:45%; top:90%; animation-duration:15s; }
.horizonParticles i:nth-child(12){ left:82%; top:62%; animation-duration:13s; }

@keyframes particleFloat{
  0%{ transform:translateY(50px) scale(.6); opacity:0; }
  20%{ opacity:.65; }
  75%{ opacity:.35; }
  100%{ transform:translateY(-110vh) scale(1.2); opacity:0; }
}

/* =========================================================
   CLICK SPARKS & TOAST
========================================================= */

.clickSpark{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  animation:sparkFly .65s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes sparkFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--tx), var(--ty)) scale(0); opacity:0; }
}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(24,20,38,.96);
  border:1px solid rgba(168,125,255,.45);
  color:#fff;
  padding:12px 20px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  z-index:9500;
  opacity:0;
  pointer-events:none;
  box-shadow:0 12px 35px rgba(0,0,0,.6), 0 0 24px rgba(139,92,255,.35);
  transition:.28s cubic-bezier(.16,1,.3,1);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================================================
   APP & SCROLL PROGRESS BAR
========================================================= */

#scrollBar{
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0%;
  z-index:200;
  background:linear-gradient(90deg,#8b5cff,#ff4fd8,#42b9ff,#00ffc3);
  box-shadow:0 0 14px rgba(255,79,216,.8);
  transition:width .1s ease-out;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  position:relative;
}

.page{
  width:100%;
  max-width:940px;
  margin:auto;
  min-height:100vh;
  padding:32px 18px 120px;
  animation:pageIn .65s cubic-bezier(.16,1,.3,1);
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(30px) scale(.97);
    filter:blur(8px);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

/* =========================================================
   BRAND & GLOWING MADE BY KUSH KUMAR
========================================================= */

.brand{
  text-align:center;

}

.made{
  color:#f6e8ff;

  letter-spacing:6px;

    0 0 22px rgba(139,92,255,.35),

    fadeDown .7s ease both,

.kushGlow{

    0 0 8px rgba(255,255,255,.8),

@keyframes fadeDown{
  from{ opacity:0; transform:translateY(-20px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes kushGlowPulse{
  0%,100%{
    border-color:rgba(255,79,216,.48);
    box-shadow:
      0 0 18px rgba(139,92,255,.3),
      0 0 36px rgba(255,79,216,.2),
      inset 0 0 10px rgba(255,255,255,.12);

  }
  50%{

    box-shadow:
      0 0 28px rgba(139,92,255,.6),
      0 0 56px rgba(255,79,216,.45),
      0 0 75px rgba(66,185,255,.25),
      inset 0 0 16px rgba(255,255,255,.25);
    transform:scale(1.03);
  }
}

@keyframes kushTextPulse{
  0%,100%{
    text-shadow:
      0 0 6px rgba(255,255,255,.7),
      0 0 16px rgba(255,79,216,.85),
      0 0 28px rgba(139,92,255,.75);
  }
  50%{
    text-shadow:
      0 0 10px rgba(255,255,255,.95),
      0 0 24px rgba(255,79,216,1),
      0 0 40px rgba(139,92,255,.95),

}

.logo{

.logo span{

@keyframes textShimmer{

.logo::after{

.mainBtn:nth-child(2){ animation-delay:.06s; }
.mainBtn:nth-child(3){ animation-delay:.12s; }
.mainBtn:nth-child(4){ animation-delay:.18s; }
.mainBtn:nth-child(5){ animation-delay:.24s; }
.mainBtn:nth-child(6){ animation-delay:.30s; }
.mainBtn:nth-child(7){ animation-delay:.36s; }
.mainBtn:nth-child(8){ animation-delay:.42s; }

@keyframes buttonIn{

/* =========================================================
   CATEGORY GRID
========================================================= */

.categoryGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.category{
  position:relative;
  overflow:hidden;
  min-height:112px;
  border-radius:24px;
  padding:18px;
  text-align:left;
  color:#fff;
  transform-style:preserve-3d;
  background:linear-gradient(145deg, rgba(38,33,58,.82), rgba(16,15,25,.85));
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(16px);
  transition:
    transform .28s cubic-bezier(.16,1,.3,1),
    border-color .3s,
    box-shadow .3s;
  animation:cardIn .55s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn{
  from{ opacity:0; transform:translateY(24px) scale(.93); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

.category::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    circle at var(--mx, 50%) var(--my, 50%),
    rgba(255,255,255,.14),
    transparent 60%

  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}

.category:hover::before{

}

.category::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-50px;
  bottom:-60px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(139,92,255,.25),rgba(255,79,216,.2));

}

.category:hover{

  box-shadow:
    0 22px 50px rgba(0,0,0,.38),
    0 0 38px rgba(139,92,255,.22);
}

.category:hover::after{
  transform:scale(2);
}

.category:active{
  transform:scale(.95);
}

.category .emoji{

  display:inline-block;
  margin-bottom:9px;
  transition:.35s cubic-bezier(.34,1.56,.64,1);
}

.category:hover .emoji{

}

.category b{

}

.category small{

}

}

/* =========================================================
   SPECIAL CARD
========================================================= */

.specialCard{
  position:relative;
  margin-top:20px;
  border:1px solid rgba(168,125,255,.28);
  background:linear-gradient(135deg, rgba(48,38,76,.82), rgba(16,14,26,.86));

@keyframes specialGlow{

.pollDock{

.nexoraInputBar{

/* =========================================================

========================================================= */

.comboStepCard{

.wheelWrap{

/* =========================================================

========================================================= */

.statsGrid{

}

.statCard{
  background:linear-gradient(145deg, rgba(38,33,58,.82), rgba(16,15,25,.85));
  border:1px solid rgba(255,255,255,.1);

  padding:16px;
  text-align:center;
  backdrop-filter:blur(14px);
  transition:.3s ease;
}

.statCard:hover{
  transform:translateY(-4px);
  border-color:rgba(139,92,255,.4);
}

.statCard b{
  display:block;
  font-size:28px;
  font-weight:1000;
  color:#fff;
  margin-bottom:4px;
}

.statCard small{
  color:#9996a5;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}

.mgmtControls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.mgmtControls .search{
  flex:1;
  min-width:200px;
  margin-bottom:0;
}

.mgmtBtn{
  padding:14px 16px;
  border-radius:16px;
  font-weight:900;
  font-size:13px;
  transition:.25s ease;
  white-space:nowrap;
}

.mgmtBtn.export{
  background:#fff;
  color:#111;
}

.mgmtBtn.danger{
  background:rgba(255,65,90,.16);
  color:#ff6b81;
  border:1px solid rgba(255,65,90,.3);
}

.mgmtBtn:hover{
  transform:translateY(-2px);
}

.recordMeta{
  display:grid;
  gap:6px;
  margin-top:10px;
  font-size:13px;
  color:#aaa7b5;
}

.recordMeta span{
  display:flex;
  align-items:center;
  gap:6px;
}

.errorMsg{
  color:#ff6b81;
  font-size:13px;
  font-weight:800;
  margin-top:8px;
  min-height:18px;
}

/* =========================================================
   NOTICE & EMPTY
========================================================= */

.notice{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:14px;
  color:#9490a3;
  font-size:12px;
  line-height:1.5;
  margin-bottom:18px;
  backdrop-filter:blur(12px);
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#858290;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
  border-radius:22px;
}

/* =========================================================
   FLOATING SCROLL TOP BUTTON
========================================================= */

.floating{
  position:fixed;
  right:18px;
  bottom:86px;
  z-index:50;
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#111;
  font-size:20px;
  font-weight:1000;
  box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    0 0 28px rgba(139,92,255,.25);
  transition:.3s cubic-bezier(.34,1.56,.64,1);
}

.floating:hover{
  transform:translateY(-6px) scale(1.1) rotate(-8deg);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(2,2,6,.82);
  backdrop-filter:blur(22px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
  animation:modalIn .3s ease;
}

@keyframes modalIn{
  from{ opacity:0; }
  to{ opacity:1; }
}

.modalBox{
  width:min(520px,100%);
  background:linear-gradient(145deg, rgba(34,30,52,.97), rgba(13,13,20,.98));
  border:1px solid rgba(168,125,255,.22);
  border-radius:30px;
  padding:26px;
  box-shadow:
    0 30px 100px rgba(0,0,0,.8),
    0 0 60px rgba(139,92,255,.16);
  animation:modalBoxIn .45s cubic-bezier(.16,1,.3,1);
}

@keyframes modalBoxIn{
  from{ transform:translateY(30px) scale(.92); opacity:0; }
  to{ transform:translateY(0) scale(1); opacity:1; }
}

.modalBox h2{
  margin:0 0 8px;
  font-size:29px;
}

.modalBox p{
  color:#9894a6;
  line-height:1.45;
}

.setupStep{
  display:none;
}

.setupStep.active{
  display:block;
}

.input{
  margin:15px 0;
}

.collegeOptions{
  display:grid;
  gap:12px;
  margin-top:20px;
}

.collegeOption{
  text-align:left;
  background:rgba(255,255,255,.055);
  color:#fff;
  border:1px solid rgba(255,255,255,.09);
  border-radius:20px;
  padding:17px;
  transition:.25s cubic-bezier(.16,1,.3,1);
}

.collegeOption:hover{
  transform:translateX(6px);
  border-color:rgba(168,125,255,.4);
}

.collegeOption.selected{
  background:linear-gradient(135deg,#fff,#ece4ff);
  color:#111;
  border-color:#fff;
  box-shadow:0 12px 35px rgba(139,92,255,.25);
}

.collegeOption b{
  display:block;
  font-size:17px;
}

.collegeOption small{
  display:block;
  margin-top:5px;
  opacity:.72;
}

.modalActions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modalActions button{
  flex:1;
  padding:14px;
  border-radius:15px;
  font-weight:900;
  transition:.25s ease;
}

.primary{
  background:#fff;
  color:#111;
}

.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(255,255,255,.2);
}

.secondary{
  background:#292733;
  color:#fff;
}

.secondary:hover{
  background:#343140;
}

/* =========================================================
   BEAUTY MODE (CORNER USER BADGE + CENTER STAGE)
========================================================= */

.beauty{
  text-align:center;
  padding-top:24px;
  min-height:100vh;
  position:relative;
}

.beauty::before{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  top:16%;
  left:50%;
  transform:translateX(-50%);
  background:radial-gradient(
    circle,
    rgba(255,79,216,.26),
    rgba(139,92,255,.15) 45%,
    transparent 70%
  );
  filter:blur(28px);
  pointer-events:none;
  animation:beautyGlow 4.5s ease-in-out infinite;
}

@keyframes beautyGlow{
  0%,100%{ transform:translateX(-50%) scale(.9); opacity:.65; }
  50%{ transform:translateX(-50%) scale(1.32); opacity:1; }
}

.beautyTopBar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:24px;
  text-align:left;
}

.beautyCornerGroup{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-left:auto;
}

.beautyCornerBadge{
  margin-bottom:0 !important;
  padding:8px 13px;
  font-size:12px;
}

.beautyIcon{
  position:relative;
  font-size:76px;
  margin:36px 0 28px;
  display:inline-block;
  filter:drop-shadow(0 0 25px rgba(255,79,216,.45));
  animation:beautyFloat 2.6s ease-in-out infinite;
}

@keyframes beautyFloat{
  0%,100%{ transform:translateY(0) rotate(-4deg) scale(1); }
  50%{ transform:translateY(-16px) rotate(5deg) scale(1.08); }
}

.beautyText{
  position:relative;
  font-size:clamp(25px,7vw,48px);
  font-weight:1000;
  line-height:1.1;
  max-width:720px;
  margin:0 auto 35px;
  transition:.35s cubic-bezier(.16,1,.3,1);
  text-shadow:0 0 35px rgba(255,79,216,.2);
}

.beautyBtn{
  position:fixed;
  z-index:120;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#fff,#f5d9ff);
  color:#111;
  padding:16px 30px;
  border-radius:18px;
  font-weight:1000;
  min-width:155px;
  box-shadow:
    0 14px 38px rgba(0,0,0,.4),
    0 0 32px rgba(255,79,216,.25);
  transition:
    left .55s cubic-bezier(.16,1,.3,1),
    bottom .55s cubic-bezier(.16,1,.3,1),
    transform .35s ease,
    box-shadow .3s ease;
}

.beautyBtn:hover{
  box-shadow:
    0 20px 50px rgba(0,0,0,.5),
    0 0 42px rgba(255,79,216,.4);
}

.beautyBtn:active{
  transform:translateX(-50%) scale(.9);
}

.beautyBack{
  position:relative;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:12px 22px;
  border-radius:15px;
  font-weight:900;
  border:1px solid rgba(255,255,255,.1);
  transition:.25s ease;
}

.beautyBack:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.14);
}

/* =========================================================
   DICE SPIN ANIMATION
========================================================= */

.diceSpin{
  display:inline-block;
  font-size:76px;
  margin-bottom:18px;
  filter:drop-shadow(0 0 28px rgba(139,92,255,.55));
  animation:
    diceTumble .85s cubic-bezier(.34,1.56,.64,1),
    beautyFloat 2.4s .85s ease-in-out infinite;
}

@keyframes diceTumble{
  0%{ transform:scale(.3) rotate(-360deg) translateY(-40px); opacity:0; }
  70%{ transform:scale(1.18) rotate(18deg) translateY(4px); opacity:1; }
  100%{ transform:scale(1) rotate(0deg) translateY(0); }
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  text-align:center;
  color:#605d6e;
  font-size:10px;
  margin-top:55px;
  letter-spacing:2.5px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){
  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .categoryGrid{
    gap:9px;
  }

  .category{
    min-height:96px;
    border-radius:20px;
  }

  .statsGrid{
    gap:8px;
  }

  .statCard{
    padding:12px 8px;
  }

  .statCard b{
    font-size:22px;
  }

  .sectionTop{
    align-items:flex-start;
  }

  .sectionTop .changeBtn,
  .sectionTop .backBtn,
  .beautyTopBar .changeBtn,
  .beautyTopBar .backBtn{
    padding:9px 11px;
    font-size:12px;
  }

  .beautyCornerGroup{
    flex-direction:column;
    align-items:flex-end;
  }

  .beautyBtn{
    bottom:82px;
  }

  .timeVibeBanner{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

function spawnSparks(x,y,count=10){
  const colors=["#8b5cff","#ff4fd8","#42b9ff","#00ffa3","#ffffff"];
  for(let i=0;i<count;i++){
    const spark=document.createElement("i");
    spark.className="clickSpark";
    const angle=(Math.PI*2*i)/count + (Math.random()-.5)*.5;
    const dist=28+Math.random()*42;
    spark.style.left=x+"px";
    spark.style.top=y+"px";
    spark.style.background=colors[i%colors.length];
    spark.style.boxShadow="0 0 10px "+colors[i%colors.length];
    spark.style.setProperty("--tx",Math.cos(angle)*dist+"px");
    spark.style.setProperty("--ty",Math.sin(angle)*dist+"px");
    document.body.appendChild(spark);
    setTimeout(()=>spark.remove(),660);
  }
}

/* =========================================================
   DEVICE / BROWSER & LOGIN RECORDS
========================================================= */

function getDeviceBrowserInfo(){
  const ua=navigator.userAgent||"Unknown";
  let device="Desktop";

  if(/iPhone/i.test(ua)) device="iPhone";
  else if(/iPad/i.test(ua)) device="iPad";
  else if(/Android/i.test(ua)){
    device=/Mobile/i.test(ua) ? "Android Phone" : "Android Tablet";
  }else if(/Windows/i.test(ua)) device="Windows PC";
  else if(/Macintosh|Mac OS X/i.test(ua)) device="Mac";
  else if(/Linux/i.test(ua)) device="Linux PC";

  let browser="Unknown Browser";
  if(/Edg\//i.test(ua)) browser="Edge";
  else if(/OPR\/|Opera/i.test(ua)) browser="Opera";
  else if(/SamsungBrowser/i.test(ua)) browser="Samsung Internet";
  else if(/Firefox\//i.test(ua)) browser="Firefox";
  else if(/CriOS|Chrome\//i.test(ua)) browser="Chrome";
  else if(/Safari\//i.test(ua)) browser="Safari";

  return `${device} • ${browser}`;
}

function getLoginRecords(){
  try{
    const list=JSON.parse(localStorage.getItem(RECORDS_STORAGE_KEY)||"[]");
    return Array.isArray(list) ? list : [];
  }catch(e){
    return [];
  }
}

function recordLoginEvent(name,college){
  if(!name || !college) return;

  const now=new Date();
  const records=getLoginRecords();

  const dateStr=now.toLocaleDateString("en-IN",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });

  const timeStr=now.toLocaleTimeString("en-IN",{
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:true
  });

  const dayKey=
    now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,"0")+"-"+
    String(now.getDate()).padStart(2,"0");

  records.unshift({
    id:Date.now()+"_"+Math.random().toString(36).slice(2,7),
    name:name,
    college:college,
    dateTime:`${dateStr}, ${timeStr}`,
    dayKey:dayKey,
    deviceBrowser:getDeviceBrowserInfo()
  });

  localStorage.setItem(RECORDS_STORAGE_KEY,JSON.stringify(records));
}

function getTimeVibeInfo(){
  const hr=new Date().getHours();
  if(hr>=6 && hr<12){
    return {
      id:"morning",
      badge:"☀️ Morning Bunk Mode",
      title:"Breakfast, Filter Kaapi & Morning Walks",
      desc:"Prime hours for dosa runs, lakes, parks, and temple heritage walks.",
      primeCats:["food","cafes","parks","lakes","temples","walk"],
      exploreTypes:["Food","Cafe","Park","Nature","Temple"]
    };
  }
  if(hr>=12 && hr<16){
    return {
      id:"afternoon",
      badge:"🔥 Afternoon Heat Dodge",
      title:"AC Gaming Cafés, Board Games & Indoor Hangouts",
      desc:"Beat the afternoon sun inside gaming zones, specialty cafés, and science galleries.",
      primeCats:["gaming","cafes","activities","science","books","shopping"],
      exploreTypes:["Gaming","Cafe","Activities","Science","Books","Shopping"]
    };
  }
  if(hr>=16 && hr<20){
    return {
      id:"evening",
      badge:"🌇 Golden Hour & Sunset",
      title:"Lakes, Viewpoints, Street Snacks & Sunset Walks",
      desc:"Best window for sunset spots, chaats, desserts, and evening street walks.",
      primeCats:["sunset","lakes","hills","desserts","food","photos","walk"],
      exploreTypes:["Nature","Dessert","Food","Park","Shopping"]

  }
  return {
    id:"night",
    badge:"🌙 Night Squad Vibe",
    title:"Late Desserts, Gaming Sessions & Chill Cafés",
    desc:"Wind down with sundaes, waffles, esports sessions, or a quick food street run.",

    exploreTypes:["Dessert","Gaming","Cafe","Food"]
  };
}


/* =========================================================
   STORAGE & BUCKET LIST
========================================================= */

function saveData(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      version:APP_VERSION,
      name:selectedName,
      college:selectedCollege
    })
  );
}

function loadData(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(data && data.college){
      selectedName=data.name||"";
      selectedCollege=data.college==="Aps" ? "Aps" : "NMKRV";
      return Boolean(data.name && data.college);
    }
  }catch(e){
    console.warn("Storage reset:",e);
  }
  return false;
}

function getBucketMap(){
  try{
    const obj=JSON.parse(localStorage.getItem(BUCKET_STORAGE_KEY)||"{}");
    return obj && typeof obj==="object" ? obj : {};
  }catch(e){
    return {};
  }
}

function saveBucketMap(map){
  localStorage.setItem(BUCKET_STORAGE_KEY,JSON.stringify(map));
}

function placeKey(name){
  return selectedCollege+"::"+String(name||"").trim();
}

function toggleBucketSave(name,area,desc){
  const map=getBucketMap();
  const key=placeKey(name);
  if(map[key]?.saved){
    delete map[key].saved;
    if(!map[key].visited) delete map[key];
    showToast("Removed from Bucket List");
  }else{
    map[key]={ ...(map[key]||{}), name, area, desc, college:selectedCollege, saved:true };
    showToast("Saved to Squad Bucket List ⭐");
  }
  saveBucketMap(map);
  refreshCurrentView();
}

function openVisitStampModal(name,area,desc){
  const map=getBucketMap();
  const key=placeKey(name);
  const existing=map[key]||{};
  let chosenRating=existing.rating||5;

  const box=document.getElementById("customModalBox");
  box.innerHTML=`
    <h2>✅ Stamp Visited</h2>
    <p>Rate <strong>${escapeHtml(name)}</strong> for the ${escapeHtml(getCollegeShort())} squad log.</p>

    <div style="display:flex;gap:8px;margin:16px 0;" id="ratingRow">
      ${[1,2,3,4,5].map(n=>`
        <button
          type="button"
          class="tag"
          data-star="${n}"
          onclick="selectStampStar(${n})"
          style="flex:1;text-align:center;font-size:15px;${n<=chosenRating?'background:#fff;color:#111;':''}"
        >${n} ★</button>
      `).join("")}
    </div>

    <input
      id="visitNoteInput"
      class="input"
      maxlength="80"
      placeholder="Quick squad memory (optional)"
      value="${escapeHtml(existing.note||"")}"
    >

    <div class="modalActions">
      ${existing.visited ? `
        <button class="secondary" onclick="removeVisitStamp('${escapeHtml(name)}')">Unmark</button>
      ` : `
        <button class="secondary" onclick="closeCustomModal()">Cancel</button>
      `}
      <button class="primary" onclick="confirmVisitStamp('${escapeHtml(name)}','${escapeHtml(area)}','${escapeHtml(desc)}')">
        Save Stamp ✅
      </button>
    </div>
  `;
  box.dataset.rating=String(chosenRating);
  document.getElementById("customModal").classList.add("show");
}

function selectStampStar(n){
  const box=document.getElementById("customModalBox");
  box.dataset.rating=String(n);
  box.querySelectorAll("[data-star]").forEach(btn=>{
    const val=Number(btn.dataset.star);
    if(val<=n){
      btn.style.background="#fff";
      btn.style.color="#111";
    }else{
      btn.style.background="";
      btn.style.color="";
    }
  });
}

function confirmVisitStamp(name,area,desc){
  const box=document.getElementById("customModalBox");
  const rating=Number(box.dataset.rating||5);
  const note=(document.getElementById("visitNoteInput")?.value||"").trim();
  const map=getBucketMap();
  const key=placeKey(name);
  map[key]={
    ...(map[key]||{}),
    name,
    area,
    desc,
    college:selectedCollege,
    visited:true,
    rating,
    note,
    visitedDate:new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short"})
  };
  saveBucketMap(map);
  closeCustomModal();
  showToast(`Stamped ${name} (${rating}★) ✅`);
  refreshCurrentView();
}

function removeVisitStamp(name){
  const map=getBucketMap();
  const key=placeKey(name);
  if(map[key]){
    delete map[key].visited;
    delete map[key].rating;
    delete map[key].note;
    if(!map[key].saved) delete map[key];
    saveBucketMap(map);
  }
  closeCustomModal();
  showToast("Visited stamp removed");
  refreshCurrentView();
}

function closeCustomModal(){
  document.getElementById("customModal").classList.remove("show");
}


/* =========================================================
   SQUAD POLL BUILDER
========================================================= */

function togglePollItem(name,area){
  const idx=squadPoll.findIndex(p=>p.name===name);
  if(idx>=0){
    squadPoll.splice(idx,1);
    showToast("Removed from Squad Poll");
  }else{
    if(squadPoll.length>=3){
      showToast("Max 3 spots per Squad Poll!");
      return;
    }
    squadPoll.push({name,area});
    showToast(`Added to Poll (${squadPoll.length}/3) 🗳️`);
  }
  renderPollDock();
  refreshCurrentView();
}

function clearSquadPoll(){
  squadPoll=[];
  renderPollDock();
  refreshCurrentView();
}

function renderPollDock(){
  const wrap=document.getElementById("pollDockWrap");
  if(!wrap) return;
  if(!squadPoll.length){
    wrap.innerHTML="";
    return;
  }
  wrap.innerHTML=`
    <div class="pollDock">
      <div class="pollDockInfo">
        <b>🗳️ Squad Poll (${squadPoll.length}/3 spots)</b>
        <small>${escapeHtml(squadPoll.map(p=>p.name).join(" • "))}</small>
      </div>
      <div class="pollDockBtns">
        <button class="pollDockShare" onclick="openPollShareModal()">Share Poll 📲</button>
        <button class="pollDockClear" onclick="clearSquadPoll()">✕</button>
      </div>
    </div>
  `;
}

function openPollShareModal(){
  if(!squadPoll.length) return;
  const msg=buildPollMessage("Right after class");
  const box=document.getElementById("customModalBox");
  box.innerHTML=`
    <h2>🗳️ WhatsApp Squad Poll</h2>
    <p>Pick a meetup time and blast this poll into your group chat.</p>

    <input
      id="pollTimeInput"
      class="input"
      maxlength="40"
      value="Right after class"
      oninput="updatePollPreview()"
    >

    <pre id="pollPreview" style="white-space:pre-wrap;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:16px;font-size:12px;color:#e5e1f5;line-height:1.45;margin:10px 0;">${escapeHtml(msg)}</pre>

    <div class="modalActions">
      <button class="secondary" onclick="copyPollText()">📋 Copy</button>
      <button class="primary" onclick="sendPollWhatsApp()">WhatsApp 📲</button>
    </div>
    <div class="modalActions" style="margin-top:8px;">
      <button class="secondary" onclick="closeCustomModal()">Close</button>
    </div>
  `;
  document.getElementById("customModal").classList.add("show");
}

function buildPollMessage(timeLabel){
  const lines=[
    `🔥 *WHERE'S THE GANG?* (${getCollegeShort()} Squad Poll)`,
    `⏰ *When:* ${timeLabel || "Right after class"}`,
    `📍 *Zone:* ${getArea()}`,
    ``,
    `Vote your pick 👇`
  ];
  const nums=["1️⃣","2️⃣","3️⃣"];
  squadPoll.forEach((p,i)=>{
    lines.push(`${nums[i]} *${p.name}* (${p.area})`);
    lines.push(`   🗺️ ${mapLink(p.name,p.area)}`);
  });
  lines.push(``,`Reply 1, 2, or 3 fast! 🚀`);
  return lines.join("\n");
}

function updatePollPreview(){
  const timeVal=document.getElementById("pollTimeInput")?.value||"Right after class";
  const pre=document.getElementById("pollPreview");
  if(pre) pre.textContent=buildPollMessage(timeVal);
}

function copyPollText(){
  const timeVal=document.getElementById("pollTimeInput")?.value||"Right after class";
  const text=buildPollMessage(timeVal);
  navigator.clipboard?.writeText(text);
  showToast("Poll copied to clipboard 📋");
}

function sendPollWhatsApp(){
  const timeVal=document.getElementById("pollTimeInput")?.value||"Right after class";
  const text=encodeURIComponent(buildPollMessage(timeVal));
  window.open("https://wa.me/?text="+text,"_blank","noopener,noreferrer");
}

  renderNexora();

function generateNexoraReply(query){
  const q=query.toLowerCase();
  const planner=getPlannerData();
  const keywordMap=[
    {keys:["game","gaming","pc","ps5","esport","board","arcade","bowl"],cat:"gaming"},
    {keys:["movie","cinema","film","theatre"],cat:"cinema"},
    {keys:["shop","market","clothes","complex","bazaar"],cat:"shopping"},
    {keys:["food","eat","hungry","dosa","sandwich","snack","cheap","budget","lunch","breakfast","chaat"],cat:"food"},
    {keys:["cafe","café","coffee","kaapi","talk","study","chill"],cat:"cafes"},
    {keys:["dessert","sweet","ice cream","gelato","waffle","chocolate","sundae"],cat:"desserts"},
    {keys:["park","green","grass","trees","sit"],cat:"parks"},
    {keys:["nature","forest","bird","fresh"],cat:"nature"},
    {keys:["lake","boat","boating","water"],cat:"lakes"},
    {keys:["hill","view","climb","rock"],cat:"hills"},
    {keys:["temple","peace","quiet","heritage"],cat:"temples"},
    {keys:["science","museum","gallery","learn"],cat:"science"},
    {keys:["photo","pic","instagram","aesthetic","camera"],cat:"photos"},
    {keys:["walk","stroll","roam"],cat:"walk"},
    {keys:["sport","cricket","basketball","active"],cat:"sports"},
    {keys:["book","read","library"],cat:"books"},
    {keys:["art","paint","craft","pottery","theatre","play"],cat:"art"},
    {keys:["sunset","evening","golden"],cat:"sunset"},
    {keys:["metro","train","station"],cat:"metro"}
  ];

  let matchedCats=[];
  keywordMap.forEach(entry=>{
    if(entry.keys.some(k=>q.includes(k))) matchedCats.push(entry.cat);
  });

  if(!matchedCats.length){
    matchedCats=getTimeVibeInfo().primeCats.slice(0,2);
  }

  const seen=new Set();
  const picks=[];
  matchedCats.forEach(cat=>{
    (planner[cat]||[]).forEach(item=>{
      if(!seen.has(item[0]) && picks.length<3){
        seen.add(item[0]);
        picks.push(item);
      }
    });
  });

  const zoneName=selectedCollege==="Aps" ? "Basavanagudi / N.R. Colony" : "Jayanagar";
  const intros=[
    `Locked into ${zoneName} for ${displayName()}! Here are 3 top spots matching "${query}":`,
    `Got the vibe ✨ Staying 100% inside ${zoneName}, these 3 picks fit best right now:`,
    `Say less, ${displayName()}—here's your curated ${zoneName} shortlist:`
  ];
  const text=intros[Math.floor(Math.random()*intros.length)];
  return {text,picks};
}

function addWheelMember(){
  const inp=document.getElementById("wheelNameInput");

function removeWheelMember(idx){
  wheelMembers.splice(idx,1);
  renderSpinWheelPage();
}

function drawWheelCanvas(){
  const canvas=document.getElementById("wheelCanvas");
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  const cx=160, cy=160, r=152;
  ctx.clearRect(0,0,320,320);

  const items=wheelMembers.length ? wheelMembers : ["☆☆☆☆","☆☆☆☆"];
  const palette=["#8b5cff","#ff4fd8","#42b9ff","#00c98d","#f59e0b","#ec4899"];
  const arc=(Math.PI*2)/items.length;

  items.forEach((label,i)=>{
    const start=i*arc - Math.PI/2;
    const end=start+arc;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle=palette[i%palette.length];
    ctx.fill();
    ctx.lineWidth=2;
    ctx.strokeStyle="#070611";
    ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start+arc/2);
    ctx.textAlign="right";
    ctx.fillStyle="#fff";
    ctx.font="bold 14px Arial";
    ctx.fillText(label.slice(0,14),r-18,5);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx,cy,22,0,Math.PI*2);
  ctx.fillStyle="#0d0b18";
  ctx.fill();
  ctx.lineWidth=3;
  ctx.strokeStyle="#fff";
  ctx.stroke();
}

function spinSquadWheel(){
  if(wheelSpinning) return;
  if(wheelMembers.length<2){
    showToast("Add at least 2 names first!");
    return;
  }
  wheelSpinning=true;
  const winnerIdx=Math.floor(Math.random()*wheelMembers.length);
  const segDeg=360/wheelMembers.length;
  const targetOffset=360 - (winnerIdx*segDeg + segDeg/2);
  const extraSpins=360*6;
  wheelRotation += extraSpins + ((targetOffset - (wheelRotation%360) + 360)%360);

  const canvas=document.getElementById("wheelCanvas");
  if(canvas){
    canvas.style.transform=`rotate(${wheelRotation}deg)`;
  }

  setTimeout(()=>{
    wheelSpinning=false;
    const winner=wheelMembers[winnerIdx];
    const box=document.getElementById("wheelWinnerBox");
    if(box) box.textContent=`🎉 ${winner} pays for the gang!`;
    spawnSparks(window.innerWidth/2,window.innerHeight/2,26);
  },4250);
}

function calcBillSplit(){
  const total=Math.max(0,Number(document.getElementById("splitTotal")?.value||0));
  const count=Math.max(1,Number(document.getElementById("splitCount")?.value||1));
  const perHead=Math.ceil(total/count);
  const res=document.getElementById("splitResult");
  if(res) res.textContent=`₹${perHead} per person (${count} people)`;
}

function setMgmtCollegeFilter(filter){
  mgmtCollegeFilter=filter;
  renderManagementDashboard();
}

function getFilteredManagementRecords(){
  const records=getLoginRecords();
  const search=(document.getElementById("mgmtSearch")?.value||"").toLowerCase().trim();

  return records.filter(rec=>{
    const matchesCollege=mgmtCollegeFilter==="all" || rec.college===mgmtCollegeFilter;
    const searchable=[rec.name,rec.college,rec.dateTime,rec.deviceBrowser].join(" ").toLowerCase();
    return matchesCollege && searchable.includes(search);
  });
}

function drawManagementRecords(){
  const box=document.getElementById("mgmtRecordsList");
  if(!box) return;

  const filtered=getFilteredManagementRecords();
  if(!filtered.length){
    box.innerHTML=`<div class="empty">No login records found 👀</div>`;
    return;
  }

  box.innerHTML=filtered.map((rec,idx)=>`
    <article class="placeCard" style="animation-delay:${Math.min(idx*40,400)}ms">
      <div class="placeHead">
        <div class="placeName">👤 ${escapeHtml(rec.name)}</div>
        <div class="placeType">🎓 ${escapeHtml(rec.college)}</div>
      </div>
      <div class="recordMeta">
        <span>🕒 <b>Date/Time:</b> ${escapeHtml(rec.dateTime)}</span>
        <span>💻 <b>Device/Browser:</b> ${escapeHtml(rec.deviceBrowser)}</span>
      </div>
    </article>
  `).join("");
}

function exportRecordsCSV(){
  const records=getFilteredManagementRecords();
  if(!records.length){
    showToast("No records available to export");
    return;
  }

  const headers=["Name","College","Date/Time","Device/Browser"];
  const csvRows=[
    headers.join(","),
    ...records.map(r=>[
      `"${String(r.name||"").replace(/"/g,'""')}"`,
      `"${String(r.college||"").replace(/"/g,'""')}"`,
      `"${String(r.dateTime||"").replace(/"/g,'""')}"`,
      `"${String(r.deviceBrowser||"").replace(/"/g,'""')}"`
    ].join(","))
  ];

  const csvContent=csvRows.join("\n");
  const blob=new Blob([csvContent],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);

  const link=document.createElement("a");
  link.href=url;
  link.download="wheres_the_gang_login_records.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast("CSV exported 📥");
}

function confirmClearLoginRecords(){
  const records=getLoginRecords();
  if(!records.length){
    showToast("Records are already empty");
    return;
  }
  const box=document.getElementById("customModalBox");
  box.innerHTML=`
    <h2>🗑️ Clear Login Records?</h2>
    <p>This will permanently wipe all ${records.length} stored login entries on this device.</p>
    <div class="modalActions">
      <button class="secondary" onclick="closeCustomModal()">Cancel</button>
      <button class="primary" style="background:#ff4d6d;color:#fff;" onclick="executeClearRecords()">Delete All</button>
    </div>
  `;
  document.getElementById("customModal").classList.add("show");
}

function executeClearRecords(){
  localStorage.removeItem(RECORDS_STORAGE_KEY);
  closeCustomModal();
  renderManagementDashboard();
  showToast("All login records cleared");
}

      next.style.left=pos.left;
      next.style.bottom=pos.bottom;

      next.animate(

          {transform:"translateX(-50%) scale(1.15) rotate(-5deg)",opacity:1},
          {transform:"translateX(-50%) scale(1) rotate("+rotation+"deg)"}
