<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WHERE'S THE GANG?</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* MAIN PAGE */

    .home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .tagline {
      color: #bdbdbd;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
    }

    .white-button {
      background: white;
      color: #111111;
    }

    .dark-button {
      background: #29292f;
      color: white;
    }

    /* DARK BACKGROUND OVERLAY */

    .overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.82);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 1000;
    }

    /* POPUP */

    .popup {
      width: 100%;
      max-width: 430px;

      background: #1d1d22;

      border-radius: 24px;

      padding: 30px 24px;

      text-align: center;

      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.6);
    }

    .popup-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .popup-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .popup-text {
      color: #aaaaaa;
      font-size: 16px;
      margin-bottom: 28px;
    }

    .question {
      text-align: left;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .name-input {
      width: 100%;

      padding: 16px;

      background: #111111;

      color: white;

      border: 1px solid #3b3b43;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      margin-bottom: 8px;
    }

    .name-input:focus {
      border-color: white;
    }

    .error {
      color: #ff7777;

      font-size: 14px;

      text-align: left;

      margin-bottom: 12px;

      display: none;
    }

    .continue-button {
      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 13px;

      background: white;

      color: #111111;

      font-size: 17px;

      font-weight: bold;

      margin-top: 10px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .logo {
        font-size: 40px;
      }

      .tagline {
        font-size: 17px;
      }

      .popup {
        padding: 27px 20px;
      }

    }

  </style>
</head>


<body>


  <!-- MAIN WEBSITE -->

  <main class="home">

    <div class="container">

      <div class="logo">
        WHERE’S THE GANG?
      </div>

      <div class="tagline">
        Class can wait. The gang can't. 😂
      </div>


      <button class="button white-button">
        📍 Explore Places
      </button>


      <button class="button dark-button">
        🎯 Where Should We Go?
      </button>

    </div>

  </main>



  <!-- FIRST TIME POPUP -->

  <div class="overlay" id="namePopup">

    <div class="popup">

      <div class="popup-icon">
        👋
      </div>


      <div class="popup-title">
        First things
