   ========================================================= */

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    version:APP_VERSION,
    name:selectedName,
    college:selectedCollege
  }));
}

function loadData(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");

    if(data && data.name && data.college){
      selectedName=data.name;
      selectedCollege=data.college;
      return true;
    }
  }catch(e){
    console.warn("Storage reset:",e);
  }

  return false;
}

function openExplore(){
  currentPage="explore";
  exploreFilter="all";
  renderExplore();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderExplore(){
  const data=getExploreData();

  const filters=[
    "all",
    ...Array.from(new Set(data.map(x=>x[1])))
  ];

  document.getElementById("app").innerHTML=`
    <main class="page">

      ${header(
        "Explore Places",
        "Everything shown below belongs to your selected college's location."
      )}

      <div class="notice">
        🔒 <b>Location lock:</b>
        ${selectedCollege==="NMKRV"
          ? "Every card below is Jayanagar-focused."
          : "Every card below is Basavanagudi / N.R. Colony-focused."
        }
      </div>

      <input
        id="exploreSearch"
        class="search"
        placeholder="Search places..."
        oninput="filterExplore()"
      >

      <div id="exploreFilters" class="placeBtns" style="margin-bottom:18px;">
        ${filters.map(f=>`
          <button
            class="tag"
            onclick="setExploreFilter('${escapeHtml(f)}')"
            style="${exploreFilter===f ? "background:#fff;color:#111;" : ""}"
          >
            ${escapeHtml(f==="all"?"All":f)}
          </button>
        `).join("")}
      </div>

      <div id="exploreCards" class="cards"></div>

      <div class="footer">
        Always check current hours/status before travelling.
      </div>

    </main>
  `;

  drawExploreCards(data);
}

function setExploreFilter(filter){
  exploreFilter=filter;
  renderExplore();
}

function filterExplore(){
  const data=getExploreData();
  drawExploreCards(data);
}

function drawExploreCards(data){
  const search=(document.getElementById("exploreSearch")?.value||"").toLowerCase();

  const filtered=data.filter(item=>{
    const matchesFilter=
      exploreFilter==="all" || item[1]===exploreFilter;

    const text=item.join(" ").toLowerCase();

    return matchesFilter && text.includes(search);
  });

  const box=document.getElementById("exploreCards");

  if(!box)return;

  if(!filtered.length){
    box.innerHTML=`<div class="empty">No matching place found 😭</div>`;
    return;
  }

  box.innerHTML=filtered.map(item=>{
    const [name,type,area,desc]=item;

    return `
      <article class="placeCard">
        <div class="placeHead">
          <div class="placeName">${escapeHtml(name)}</div>
          <div class="placeType">${escapeHtml(type)}</div>
        </div>

        <div class="placeDesc">
          ${escapeHtml(desc)}
          <br>
          <span style="color:#666670">${escapeHtml(area)}</span>
        </div>

        <div class="placeBtns">
          <a
            class="mapBtn"
            href="${mapLink(name,area)}"
            target="_blank"
            rel="noopener"
          >
            📍 Maps
          </a>

          <span class="tag">${escapeHtml(getCollegeShort())}</span>
        </div>
      </article>
    `;
  }).join("");
}

function renderCategories(){

  document.getElementById("app").innerHTML=`
    <main class="page">

      ${header(
        "Where Should We Go?",
        "Pick a category. The planner automatically uses only your selected college's area."
      )}

      <div class="notice">
        🔐 <b>${escapeHtml(getCollegeShort())} mode:</b>
        ${selectedCollege==="NMKRV"
          ? "Jayanagar-only places."
          : "N.R. Colony / Basavanagudi-only places."
        }
      </div>

      <div class="categoryGrid">

        ${categories.map((c,index)=>`
          <button
            class="category"
            style="animation-delay:${Math.min(index*25,500)}ms"
            onclick="openCategory('${c[0]}')"
          >
            <span class="emoji">${c[1]}</span>
            <b>${escapeHtml(c[2])}</b>
            <small>${escapeHtml(c[3])}</small>
          </button>
        `).join("")}

      </div>

      <div class="specialCard">

        <h3>🎲 Can't decide?</h3>

        <p>
          Let the gang planner randomly pick something from
          ${selectedCollege==="NMKRV" ? "Jayanagar" : "Basavanagudi"}.
        </p>

        <button class="specialBtn" onclick="surpriseMe()">
          Surprise Me 🎲
        </button>

      </div>

      <div class="footer">
        21 categories • Beauty Mode stays separate
      </div>

    </main>
  `;
}

function openCategory(category){
  currentPage="category";
  currentCategory=category;

  const definition=categories.find(c=>c[0]===category);
  const data=getPlannerData()[category]||[];

  document.getElementById("app").innerHTML=`
    <main class="page">

      <div class="sectionTop">
        <button class="backBtn" onclick="openPlanner()">← Categories</button>
        <button class="changeBtn" onclick="openChangeCollege()">Change College</button>
      </div>

      <div class="userBadge">
        👋 <strong>${escapeHtml(selectedName)}</strong>
        <span>•</span>
        <span>${escapeHtml(getCollegeShort())}</span>
      </div>

      <div class="locationPill">
        📍 ${escapeHtml(getArea())}
      </div>

      <h1 class="pageTitle">
        ${definition ? definition[1] : ""} ${definition ? definition[2] : ""}
      </h1>

      <div class="pageSub">
        ${escapeHtml(definition ? definition[3] : "")}
      </div>

      <div class="cards">
        ${data.length
          ? data.map(item=>placeCard(item)).join("")
          : `<div class="empty">Nothing listed yet. Pick another category 👀</div>`
        }
      </div>

    </main>
  `;

  window.scrollTo({top:0,behavior:"smooth"});
}

function placeCard(item){
  const [name,area,desc,tags]=item;

  return `
    <article class="placeCard">

      <div class="placeHead">
        <div class="placeName">${escapeHtml(name)}</div>
        <div class="placeType">${escapeHtml(area)}</div>
      </div>

      <div class="placeDesc">
        ${escapeHtml(desc)}
      </div>

      <div class="placeBtns">

        <a
          class="mapBtn"
          href="${mapLink(name,area)}"
          target="_blank"
          rel="noopener"
        >
          📍 Open Maps
        </a>

        <span class="tag">
          ${escapeHtml(tags)}
        </span>

      </div>

    </article>
  `;
}

function backToCategories(){
  openPlanner();
}

function surpriseMe(){
  const planner=getPlannerData();
  const all=[];

  Object.keys(planner).forEach(category=>{
    planner[category].forEach(item=>{
      all.push({
        category,
        item
      });
    });
  });

  if(!all.length)return;

  const random=all[Math.floor(Math.random()*all.length)];
  const definition=categories.find(c=>c[0]===random.category);

  document.getElementById("app").innerHTML=`
    <main class="page">

      <div class="sectionTop">
        <button class="backBtn" onclick="openPlanner()">← Planner</button>
        <button class="changeBtn" onclick="openChangeCollege()">Change College</button>
      </div>

      <div class="userBadge">
        👋 <strong>${escapeHtml(selectedName)}</strong>
      </div>

      <div class="locationPill">
        📍 ${escapeHtml(getArea())}
      </div>

      <div style="text-align:center;padding:60px 10px;">

        <div style="font-size:65px;margin-bottom:18px;">🎲</div>

        <div style="color:#888892;font-weight:800;margin-bottom:10px;">
          RANDOM PICK
        </div>

        <h1 class="pageTitle">
          ${escapeHtml(random.item[0])}
        </h1>

        <p class="pageSub">
          ${escapeHtml(random.item[2])}
        </p>

        <div class="locationPill">
          ${definition ? definition[1] : ""} ${definition ? definition[2] : ""}
        </div>

        <div class="placeBtns" style="justify-content:center;margin-top:20px;">

          <a
            class="mapBtn"
            href="${mapLink(random.item[0],random.item[1])}"
            target="_blank"
            rel="noopener"
          >
            📍 Maps
          </a>

          <button class="tag" onclick="surpriseMe()">
            Again 🎲
          </button>

        </div>

      </div>

    </main>
  `;

  window.scrollTo({top:0,behavior:"smooth"});
}


/* =========================================================
   BEAUTY MODE
   ========================================================= */

const beautyMessages=[
  "Beauty section? 👀 You're already doing pretty well.",
  "Okay okay… someone's clearly here to upgrade the vibe ✨",
  "At this point, the website is getting nervous 💀",
  "WAIT 😭 Why are you making the whole page look better just by being here?",
  "BADDIE DETECTED 🚨✨ Certified vibe detected. No further upgrades required."
];

function openBeauty(){
  currentPage="beauty";
  beautyStep=0;
  renderBeauty();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderBeauty(){
  document.getElementById("app").innerHTML=`
    <main class="page beauty">

      <div class="sectionTop" style="text-align:left;">
        <button class="backBtn" onclick="goHome()">← Home</button>
        <button class="changeBtn" onclick="openChangeCollege()">Change College</button>
      </div>

      <div class="userBadge">
        👋 <strong>${escapeHtml(selectedName)}</strong>
        <span>•</span>
        <span>${escapeHtml(getCollegeShort())}</span>
      </div>

      <div class="beautyIcon">💅</div>

      <div id="beautyText" class="beautyText">
        ${beautyMessages[0]}
      </div>

      <button
        id="beautyNext"
        class="beautyBtn"
        onclick="nextBeauty()"
      >
        Next →
      </button>

      <br>

      <button
        class="beautyBack"
        onclick="goHome()"
      >
        ← Back
      </button>

    </main>
  `;
}

function nextBeauty(){

  if(beautyStep < beautyMessages.length-1){
    beautyStep++;
  }

  const text=document.getElementById("beautyText");
  const next=document.getElementById("beautyNext");

  if(text){
    text.style.opacity="0";
    text.style.transform="translateY(10px)";

    setTimeout(()=>{
      text.textContent=beautyMessages[beautyStep];
      text.style.opacity="1";
      text.style.transform="translateY(0)";
    },150);
  }

  if(beautyStep===beautyMessages.length-1 && next){
    next.style.display="none";
  }
}


/* =========================================================
   COLLEGE CHANGE
   ========================================================= */

function openChangeCollege(){

  collegeChangeMode=true;
  returnPage=currentPage;

  temporaryCollege=selectedCollege;

  document.getElementById("collegeModalTitle").textContent="Change College 📍";
  document.getElementById("collegeModalSub").textContent=
    "Your name stays saved. Only the location data will change.";

  document.getElementById("nameStep").classList.remove("active");
  document.getElementById("collegeStep").classList.add("active");

  updateCollegeSelection();

  document.getElementById("modal").classList.add("show");
}

function chooseCollege(college){
  temporaryCollege=college;
  updateCollegeSelection();
}

function updateCollegeSelection(){

  document.getElementById("nmkrvOption")
    .classList.toggle("selected",temporaryCollege==="NMKRV");

  document.getElementById("apsOption")
    .classList.toggle("selected",temporaryCollege==="APS The Shanda");
}

function saveCollege(){

  if(!temporaryCollege){
    alert("Pick a college first.");
    return;
  }

  selectedCollege=temporaryCollege;
  saveData();

  document.getElementById("modal").classList.remove("show");

  collegeChangeMode=false;

  /*
    IMPORTANT:
    Stay on the page the user was already using.
    Re-render using ONLY the newly selected college data.
  */

  if(returnPage==="explore"){
    renderExplore();
  }else if(returnPage==="planner"){
    renderCategories();
  }else if(returnPage==="category"){
    openCategory(currentCategory);
  }else if(returnPage==="beauty"){
    renderBeauty();
  }else{
    renderHome();
  }

  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelCollegeChange(){

  if(collegeChangeMode){
    temporaryCollege=selectedCollege;
    collegeChangeMode=false;

    document.getElementById("modal").classList.remove("show");
    return;
  }

  closeSetup();
}

function closeSetup(){
  document.getElementById("modal").classList.remove("show");
}


/* =========================================================
   FIRST SETUP
   ========================================================= */

function showFirstSetup(){

  collegeChangeMode=false;
  temporaryCollege="";

  document.getElementById("collegeModalTitle").textContent="Pick your college 📍";
  document.getElementById("collegeModalSub").textContent=
    "We'll keep your places completely separated.";

  document.getElementById("nameStep").classList.add("active");
  document.getElementById("collegeStep").classList.remove("active");

  document.getElementById("nameInput").value="";

  document.getElementById("modal").classList.add("show");
}

function goToCollegeStep(){

  const input=document.getElementById("nameInput");
  const name=(input.value||"").trim();

  if(!name){
    input.focus();
    return;
  }

  selectedName=name;
  temporaryCollege="";

  document.getElementById("nameStep").classList.remove("active");
  document.getElementById("collegeStep").classList.add("active");

  updateCollegeSelection();
}

function initialCollegeSave(){

  if(!temporaryCollege){
    alert("Pick a college first.");
    return;
  }

  selectedCollege=temporaryCollege;
  saveData();

  document.getElementById("modal").classList.remove("show");

  renderHome();
}


/*
  The same saveCollege button handles both:
  - first setup
  - change college

  We intercept first setup here by wrapping the old behavior.
*/
const originalSaveCollege=saveCollege;

saveCollege=function(){

  if(!collegeChangeMode){
    initialCollegeSave();
    return;
  }

  originalSaveCollege();
};


/* =========================================================
   HOME
   ========================================================= */

function goHome(){
  renderHome();
  window.scrollTo({top:0,behavior:"smooth"});
}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener("keydown",function(e){

  if(e.key==="Enter"){

    const nameStep=document.getElementById("nameStep");

    if(
      document.getElementById("modal")?.classList.contains("show") &&
      nameStep?.classList.contains("active")
    ){
      goToCollegeStep();
    }

  }

  if(e.key==="Escape"){
    const modal=document.getElementById("modal");

    if(modal?.classList.contains("show")){
      cancelCollegeChange();
    }
  }

});


/* =========================================================
   START
   ========================================================= */

(function start(){

  if(loadData()){

    if(
      selectedCollege!=="NMKRV" &&
      selectedCollege!=="APS The Shanda"
    ){
      selectedCollege="NMKRV";
      saveData();
    }

    renderHome();

  }else{

    showFirstSetup();

  }

})();

</script>
